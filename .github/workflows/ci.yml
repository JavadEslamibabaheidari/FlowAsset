name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore FlowAsset.slnx

      - name: Build
        run: dotnet build FlowAsset.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test FlowAsset.slnx --no-build --configuration Release

      - name: Build Docker image
        run: docker build -t flowasset:latest .