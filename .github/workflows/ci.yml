name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore FlowAsset.slnx

      - name: Build
        run: dotnet build FlowAsset.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test FlowAsset.slnx --no-build --configuration Release

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ghcr.io/javadeslamibabaheidari/flowasset:latest ./FlowAsset 
      
      - name: Push Docker image
        run: docker push ghcr.io/javadeslamibabaheidari/flowasset:latest